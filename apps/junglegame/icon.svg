<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="jungleSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="waterfallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#jungleSky)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#4338ca" stroke-width="4" />

  <!-- Moon in Night Sky -->
  <circle cx="380" cy="120" r="48" fill="url(#moonGlow)" opacity="0.9" />
  <circle cx="360" cy="110" r="40" fill="#1e1b4b" opacity="0.4" />

  <!-- Distant Mountains -->
  <polygon points="60,340 180,180 300,340" fill="#1e293b" opacity="0.7" />
  <polygon points="220,340 360,160 480,340" fill="#0f172a" opacity="0.8" />

  <!-- Waterfall -->
  <path d="M 235,260 Q 256,280 277,260 L 290,400 L 222,400 Z" fill="url(#waterfallGrad)" opacity="0.85" />

  <!-- Jungle Trees / Foliage Silhouettes -->
  <path d="M 0,340 Q 60,300 120,350 Q 180,290 240,360 Q 300,290 360,350 Q 420,300 512,340 L 512,512 L 0,512 Z" fill="#064e3b" />
  <path d="M 0,390 Q 70,350 140,410 Q 210,340 280,410 Q 350,340 420,400 Q 480,360 512,390 L 512,512 L 0,512 Z" fill="#022c22" />

  <!-- Center 3D Compass / Adventure Badge -->
  <circle cx="256" cy="270" r="64" fill="#0f172a" stroke="url(#goldText)" stroke-width="6" />
  <!-- Gem / Trophy icon -->
  <polygon points="256,230 286,260 256,310 226,260" fill="url(#goldText)" />
  <polygon points="256,230 270,260 256,310 242,260" fill="#fef08a" />

  <!-- Title Badge -->
  <rect x="76" y="415" width="360" height="62" rx="18" fill="#0f172a" stroke="#d97706" stroke-width="3" />
  <text x="256" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="2">JUNGLE ESCAPE 3D</text>
</svg>
