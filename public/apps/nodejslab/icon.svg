<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22c55e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#16a34a" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Hexagon Node.js Icon -->
      <polygon points="256,130 350,184 350,292 256,346 162,292 162,184" fill="#15803d" stroke="#86efac" stroke-width="8"/>
      <text x="256" y="270" font-family="system-ui, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle">JS</text>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#22c55e" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">NODE.JS LAB</text>
  
</svg>