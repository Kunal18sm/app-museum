<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#dc2626" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Graduation cap + Play button -->
      <polygon points="256,120 380,180 256,240 132,180" fill="#ef4444" stroke="#fca5a5" stroke-width="4"/>
      <polygon points="216,210 216,330 336,270" fill="#ffffff" filter="url(#glow)"/>
      <path d="M380 180 V260" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
      <circle cx="380" cy="270" r="8" fill="#f97316"/>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#ef4444" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">STUDYPLAY PRO</text>
  
</svg>