<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ea580c" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Glowing half sun over horizon & water reflection -->
      <path d="M156 260 A100 100 0 0 1 356 260 Z" fill="#fbbf24"/>
      <line x1="106" y1="264" x2="406" y2="264" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
      <line x1="136" y1="290" x2="376" y2="290" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
      <line x1="166" y1="316" x2="346" y2="316" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
      <line x1="196" y1="340" x2="316" y2="340" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#f97316" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SUNSET CANVAS</text>
  
</svg>