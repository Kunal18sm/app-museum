<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#374151" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Browser window with webpage layout -->
      <rect x="136" y="140" width="240" height="220" rx="28" fill="#1f2937" stroke="#60a5fa" stroke-width="8"/>
      <circle cx="170" cy="170" r="8" fill="#ef4444"/>
      <circle cx="194" cy="170" r="8" fill="#f59e0b"/>
      <circle cx="218" cy="170" r="8" fill="#10b981"/>
      <rect x="160" y="204" width="192" height="60" rx="12" fill="#3b82f6"/>
      <rect x="160" y="280" width="90" height="50" rx="10" fill="#a855f7"/>
      <rect x="262" y="280" width="90" height="50" rx="10" fill="#10b981"/>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#38bdf8" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">MINI WEBSITES</text>
  
</svg>