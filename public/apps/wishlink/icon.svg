<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#d946ef" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#a21caf" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Gift Box with Ribbon & Stars -->
      <rect x="166" y="200" width="180" height="150" rx="24" fill="#a21caf" stroke="#f472b6" stroke-width="8"/>
      <rect x="150" y="170" width="212" height="40" rx="14" fill="#db2777" stroke="#f472b6" stroke-width="6"/>
      <rect x="244" y="170" width="24" height="180" fill="#fdf2f8"/>
      <circle cx="220" cy="150" r="20" fill="none" stroke="#fdf2f8" stroke-width="8"/>
      <circle cx="292" cy="150" r="20" fill="none" stroke="#fdf2f8" stroke-width="8"/>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#d946ef" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">WISHLINK</text>
  
</svg>