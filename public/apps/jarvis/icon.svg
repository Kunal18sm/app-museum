<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#0891b2" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Arc Reactor / AI core -->
      <circle cx="256" cy="240" r="90" fill="none" stroke="#0891b2" stroke-width="12"/>
      <circle cx="256" cy="240" r="50" fill="#0891b2" stroke="#22d3ee" stroke-width="8"/>
      <circle cx="256" cy="240" r="24" fill="#ffffff"/>
      <line x1="256" y1="130" x2="256" y2="170" stroke="#22d3ee" stroke-width="8"/>
      <line x1="256" y1="310" x2="256" y2="350" stroke="#22d3ee" stroke-width="8"/>
      <line x1="146" y1="240" x2="186" y2="240" stroke="#22d3ee" stroke-width="8"/>
      <line x1="326" y1="240" x2="366" y2="240" stroke="#22d3ee" stroke-width="8"/>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#06b6d4" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">JARVIS AI</text>
  
</svg>