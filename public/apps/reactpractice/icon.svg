<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#0284c7" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Atom symbol for React -->
      <ellipse cx="256" cy="240" rx="100" ry="40" fill="none" stroke="#38bdf8" stroke-width="8" transform="rotate(0 256 240)"/>
      <ellipse cx="256" cy="240" rx="100" ry="40" fill="none" stroke="#38bdf8" stroke-width="8" transform="rotate(60 256 240)"/>
      <ellipse cx="256" cy="240" rx="100" ry="40" fill="none" stroke="#38bdf8" stroke-width="8" transform="rotate(120 256 240)"/>
      <circle cx="256" cy="240" r="20" fill="#38bdf8"/>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#0ea5e9" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">REACT PATTERNS</text>
  
</svg>