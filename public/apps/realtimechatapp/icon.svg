<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#7c3aed" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Chat bubbles overlapping -->
      <rect x="140" y="150" width="180" height="120" rx="30" fill="#6d28d9" stroke="#c084fc" stroke-width="6"/>
      <circle cx="190" cy="210" r="10" fill="#ffffff"/>
      <circle cx="230" cy="210" r="10" fill="#ffffff"/>
      <circle cx="270" cy="210" r="10" fill="#ffffff"/>
      
      <rect x="210" y="220" width="170" height="110" rx="28" fill="#be185d" stroke="#f472b6" stroke-width="6"/>
      <path d="M250 275 H340" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <path d="M250 295 H310" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#8b5cf6" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">REALTIME CHAT</text>
  
</svg>