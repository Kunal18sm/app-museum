<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31101e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#e11d48" stroke-width="4"/>

  <!-- Symbol Art with Glow -->
  <g filter="url(#glow)">
    
      <!-- Vacation cabin / Tent / Location pin -->
      <path d="M256 130 C190 130 146 180 146 240 C146 310 256 370 256 370 C256 370 366 310 366 240 C366 180 322 130 256 130 Z" fill="#be123c" stroke="#fda4af" stroke-width="6"/>
      <circle cx="256" cy="230" r="36" fill="#ffffff"/>
      <polygon points="256,205 275,245 237,245" fill="#be123c"/>
    
  </g>

  <!-- Title Badge Bottom -->
  
  <rect x="76" y="416" width="360" height="58" rx="16" fill="#090d16" stroke="#f43f5e" stroke-width="2.5" opacity="0.95"/>
  <text x="256" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">WONDERLUST</text>
  
</svg>